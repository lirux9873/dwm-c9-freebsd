name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Desktop smoke
    # GitHub provides no standard FreeBSD runner; this host only boots the VM.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and test inside FreeBSD 15.1
        uses: vmactions/freebsd-vm@4469451fe39bee80be4066836c5170362e9349f3 # v1.5.7
        with:
          release: "15.1"
          arch: x86_64
          mem: 4096
          copyback: false
          prepare: |
            set -eu
            pkg install -y gmake pkgconf libinotify \
              libX11 libXft libXinerama libXrender libxcb xcb-util \
              imlib2 freetype2 fontconfig python3 \
              xorg-vfbserver xterm xdotool xprop noto-sans-mono noto-emoji
            pw useradd -n dwmci -m -s /bin/sh
          run: |
            set -eu
            freebsd-version -kru
            uname -m
            cp -R . /home/dwmci/source
            chown -R dwmci:dwmci /home/dwmci/source
            su -l dwmci -c 'cd /home/dwmci/source && python3 tests/test-freebsd-image-builders.py'
            su -l dwmci -c 'cd /home/dwmci/source && env DWM_FREEBSD_X11_SMOKE=1 sh tests/test-freebsd-core.sh'
